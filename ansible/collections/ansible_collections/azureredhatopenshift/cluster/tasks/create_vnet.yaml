---
- name: create_vnet | Create NSGs
  when: nsgs is defined
  azure.azcollection.azure_rm_securitygroup:
    name: "{{ item.name }}"
    resource_group: "{{ resource_group }}"
    rules: "{{ item.rules }}"
  register: create_nsgs
  loop: "{{ nsgs }}"
  delegate_to: localhost

- name: create_vnet | Debug create_nsgs
  when: nsgs is defined
  ansible.builtin.debug:
    var: create_nsgs
    verbosity: 1

- name: create_vnet | Create VNET with az cli if unsupported options are needed
  when: vnet_enable_encryption | d(false) or vnet_encryption_enforcement_policy | d(false)
  block:
    - name: create_vnet | Get Vnet state
      azure.azcollection.azure_rm_virtualnetwork_info:
        name: "{{ vnet_name | d('aro-vnet') }}"
        resource_group: "{{ resource_group }}"
      delegate_to: localhost
      register: vnet_info
    - name: create_vnet | Az network vnet create
      when: vnet_info.virtualnetworks[0].provisioning_state | d("None") != "Succeeded"
      ansible.builtin.command:
        argv: "{{ argv | reject('equalto', omit) | list }}"
      vars:
        prefixes:
          - "{{ network_prefix_cidr }}"
          - "{% if apiserver_visibility is defined and apiserver_visibility == 'Private'
            %}{{ jumphost_cidr | d('192.168.254.240/28') }}{% else %}{{ omit }}{% endif %}"
        argv:
          - az
          - network
          - vnet
          - create
          - --name={{ vnet_name | d('aro-vnet') }}
          - --resource-group={{ resource_group }}
          - --address-prefixes={{ prefixes | reject('equalto', omit) | list }}
          - --location={{ location }}
          - "{% if dns_servers is defined %}--dns-servers={{ dns_servers }}{% else %}{{ omit }}{% endif %}"
          - "{% if vnet_enable_encryption is defined %}--enable-encryption={{ vnet_enable_encryption | lower }}{% else %}{{ omit }}{% endif %}"
          - "{% if vnet_encryption_enforcement_policy is defined %}\
            --encryption-enforcement-policy={{ vnet_encryption_enforcement_policy }}\
            {% else %}{{ omit }}{% endif %}"
      register: az_network_vnet_create
      changed_when: az_network_vnet_create.rc == 0
      delegate_to: localhost

- name: create_vnet | Vnet
  when: not (vnet_enable_encryption | d(false) or vnet_encryption_enforcement_policy | d(false))
  azure.azcollection.azure_rm_virtualnetwork:
    name: "{{ vnet_name | d('aro-vnet') }}"
    resource_group: "{{ resource_group }}"
    address_prefixes_cidr: "{{ prefixes | reject('equalto', omit) | list }}"
    location: "{{ location }}"
    dns_servers: "{{ dns_servers | d(omit) }}"
    tags:
      createdby: "{{ currentuser_info.userPrincipalName | d(lookup('env', 'AZURE_CLIENT_ID')) | d('unknown') }}"
      createdwith: "ansible"
      purge: "true"
  vars:
    prefixes:
      - "{{ network_prefix_cidr }}"
      - "{% if apiserver_visibility is defined and apiserver_visibility == 'Private'
        %}{{ jumphost_cidr | d('192.168.254.240/28') }}{% else %}{{ omit }}{% endif %}"
  delegate_to: localhost
  register: vnet_state
- name: create_vnet | Get Vnet state
  when: vnet_state is changed or az_network_vnet_create is changed
  azure.azcollection.azure_rm_virtualnetwork_info:
    name: "{{ vnet_name | d('aro-vnet') }}"
    resource_group: "{{ resource_group }}"
  delegate_to: localhost
  register: vnet_info
- name: create_vnet | Debug vnet_state
  ansible.builtin.debug:
    var: vnet_info
    verbosity: 1

- name: create_vnet | Create route table
  when: "routes is defined"
  block:
    - name: create_vnet | Create route table
      azure.azcollection.azure_rm_routetable:
        name: "{{ vnet_name | d('aro-vnet') }}-rt"
        resource_group: "{{ resource_group }}"
        location: "{{ location }}"
        tags:
          createdby: "{{ currentuser_info.userPrincipalName | d(lookup('env', 'AZURE_CLIENT_ID')) | d('unknown') }}"
          createdwith: "ansible"
          purge: "true"
      delegate_to: localhost
      register: route_table_state
    - name: create_vnet | Debug route_table_state
      ansible.builtin.debug:
        var: route_table_state
        verbosity: 1
    - name: create_vnet | Create routes
      azure.azcollection.azure_rm_route:
        resource_group: "{{ resource_group }}"
        name: "{{ item.name }}"
        address_prefix: "{{ item.address_prefix }}"
        next_hop_type: "{{ item.next_hop_type }}"
        route_table_name: "{{ vnet_name | d('aro-vnet') }}-rt"
      loop: "{{ routes }}"
      delegate_to: localhost
      register: route_entry_state
    - name: create_vnet | Debug route_entry_state
      ansible.builtin.debug:
        var: route_entry_state
        verbosity: 1

- name: create_vnet | Master subnet
  azure.azcollection.azure_rm_subnet:
    name: master
    virtual_network_name: "{{ vnet_name | d('aro-vnet') }}"
    address_prefix_cidr: "{{ master_cidr }}"
    resource_group: "{{ resource_group }}"
    # Setting this statically to "Disabled" because otherwise updating the subnet fails with
    # Error creating or updating subnet master - (PrivateLinkServiceNetworkPoliciesCannotBeEnabledOnPrivateLinkServiceSubnet) Private link service network
    # policies cannot be enabled on private link service subnet
    private_endpoint_network_policies: Disabled
    private_link_service_network_policies: Disabled
    route_table: "{% if routes is defined %}{{ vnet_name | d('aro-vnet') }}-rt{% else %}{{ omit }}{% endif %}"
    security_group: "{{ master_nsg | d(omit) }}"
  delegate_to: localhost
  register: master_subnet_state
- name: create_vnet | Debug master_subnet_state
  ansible.builtin.debug:
    var: master_subnet_state
    verbosity: 1
- name: create_vnet | Worker subnet
  azure.azcollection.azure_rm_subnet:
    name: worker
    virtual_network_name: "{{ vnet_name | d('aro-vnet') }}"
    address_prefix_cidr: "{{ worker_cidr }}"
    resource_group: "{{ resource_group }}"
    route_table: "{% if routes is defined %}{{ vnet_name | d('aro-vnet') }}-rt{% else %}{{ omit }}{% endif %}"
    security_group: "{{ worker_nsg | d(omit) }}"
  delegate_to: localhost
  register: worker_subnet_state
- name: create_vnet | Debug worker_subnet_state
  ansible.builtin.debug:
    var: worker_subnet_state
    verbosity: 1

- name: create_vnet | Peer cluster VNet to dev VPN VNet
  when: vpn_vnet_resource_group is defined
  block:
    - name: create_vnet | Delete stale cluster-side peering if present
      ansible.builtin.command:
        argv:
          - az
          - network
          - vnet
          - peering
          - delete
          - --name=cluster-to-vpn
          - --resource-group={{ resource_group }}
          - --vnet-name={{ vnet_name | d('aro-vnet') }}
      delegate_to: localhost
      register: delete_stale_cluster_peering
      changed_when: delete_stale_cluster_peering.rc == 0
      failed_when: false

    - name: create_vnet | Check VPN-side peering state
      ansible.builtin.command:
        argv:
          - az
          - network
          - vnet
          - peering
          - show
          - --name=vpn-to-{{ resource_group }}
          - --resource-group={{ vpn_vnet_resource_group }}
          - --vnet-name={{ vpn_vnet_name | d('dev-vpn-vnet') }}
          - --query=peeringState
          - -o=tsv
      delegate_to: localhost
      register: vpn_peering_state
      changed_when: false
      failed_when: false

    - name: create_vnet | Peer VPN VNet → cluster VNet
      ansible.builtin.command:
        argv:
          - az
          - network
          - vnet
          - peering
          - create
          - --name=vpn-to-{{ resource_group }}
          - --resource-group={{ vpn_vnet_resource_group }}
          - --vnet-name={{ vpn_vnet_name | d('dev-vpn-vnet') }}
          - --remote-vnet=/subscriptions/{{ sub_info.subscription_id }}/resourceGroups/{{ resource_group }}/providers/Microsoft.Network/virtualNetworks/{{ vnet_name | d('aro-vnet') }}
          - --allow-vnet-access
          - --allow-forwarded-traffic
          - --allow-gateway-transit
      delegate_to: localhost
      register: vnet_peering_vpn_to_cluster
      changed_when: vnet_peering_vpn_to_cluster.rc == 0
      when: vpn_peering_state.rc != 0 or vpn_peering_state.stdout | trim == ''

    - name: create_vnet | Resync disconnected VPN-side peering
      ansible.builtin.command:
        argv:
          - az
          - network
          - vnet
          - peering
          - sync
          - --name=vpn-to-{{ resource_group }}
          - --resource-group={{ vpn_vnet_resource_group }}
          - --vnet-name={{ vpn_vnet_name | d('dev-vpn-vnet') }}
      delegate_to: localhost
      register: vpn_peering_sync
      changed_when: vpn_peering_sync.rc == 0
      failed_when: false
      when: vpn_peering_state.rc == 0 and vpn_peering_state.stdout | trim != ''

    - name: create_vnet | Peer cluster VNet → VPN VNet
      ansible.builtin.command:
        argv:
          - az
          - network
          - vnet
          - peering
          - create
          - --name=cluster-to-vpn
          - --resource-group={{ resource_group }}
          - --vnet-name={{ vnet_name | d('aro-vnet') }}
          - --remote-vnet=/subscriptions/{{ sub_info.subscription_id }}/resourceGroups/{{ vpn_vnet_resource_group }}/providers/Microsoft.Network/virtualNetworks/{{ vpn_vnet_name | d('dev-vpn-vnet') }}
          - --allow-vnet-access
          - --allow-forwarded-traffic
          - --use-remote-gateways
      delegate_to: localhost
      register: vnet_peering_cluster_to_vpn
      changed_when: vnet_peering_cluster_to_vpn.rc == 0
