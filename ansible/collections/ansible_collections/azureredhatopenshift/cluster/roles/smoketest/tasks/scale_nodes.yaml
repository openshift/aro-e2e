- name: scale_nodes | Get machinesets
  kubernetes.core.k8s_info:
    ca_cert: "{{ cluster_cert_file }}"
    kubeconfig: "{{ kubeconfig_file }}"
    api_version: machine.openshift.io/v1beta1
    namespace: openshift-machine-api
    kind: MachineSet
  delegate_to: "{{ delegation }}"
  register: smoketest_oc_get_machineset

- name: scale_nodes | Create zero-scaled machineset
  kubernetes.core.k8s:
    ca_cert: "{{ cluster_cert_file }}"
    kubeconfig: "{{ kubeconfig_file }}"
    state: present
    api_version: machine.openshift.io/v1beta1
    namespace: openshift-machine-api
    kind: MachineSet
    name: "{{ machineset.metadata.name }}-zero"
    resource_definition:
      metadata:
        annotations: "{{ machineset.metadata.annotations }}"
        labels: "{{ machineset.metadata.labels }}"
      spec:
        replicas: 0
        selector:
          matchLabels:
            "machine.openshift.io/cluster-api-cluster": "{{ machineset.spec.selector.matchLabels['machine.openshift.io/cluster-api-cluster'] }}"
            "machine.openshift.io/cluster-api-machineset": "{{ machineset.metadata.name }}-zero"
        template:
          metadata:
            labels:
              "machine.openshift.io/cluster-api-cluster": "{{ machineset.spec.template.metadata.labels['machine.openshift.io/cluster-api-cluster'] }}"
              "machine.openshift.io/cluster-api-machineset": "{{ machineset.metadata.name }}-zero"
          spec: "{{ machineset.spec.template.spec }}"
  vars:
    machineset: "{{ smoketest_oc_get_machineset.resources[0] }}"
  delegate_to: "{{ delegation }}"
  when: smoketest_oc_get_machineset.resources | length > 0

- name: scale_nodes | Select a machineset to scale
  ansible.builtin.set_fact:
    smoketest_candidate_machineset: "{{ smoketest_oc_get_machineset.resources[0] }}"
- name: scale_nodes | Show selected machineset
  ansible.builtin.debug:
    msg: >-
      Scaling will be performed on {{ smoketest_candidate_machineset.metadata.name }},
      it will be scaled to
      {{ smoketest_candidate_machineset.spec.replicas | d(1) - 1 }}"

- name: scale_nodes | Scale down machineset
  kubernetes.core.k8s:
    ca_cert: "{{ cluster_cert_file }}"
    kubeconfig: "{{ kubeconfig_file }}"
    state: patched
    api_version: machine.openshift.io/v1beta1
    namespace: openshift-machine-api
    kind: MachineSet
    name: "{{ smoketest_candidate_machineset.metadata.name }}"
    # Build the patch body as JSON text; depending on the Ansible/Jinja version,
    # this may already be auto-converted to a native dict, or it may still be a
    # plain string, so only run from_json when it's still a string. Either way
    # this guarantees "replicas" ends up a native int, not a string (see
    # node/cluster operator condition loops above for the same issue).
    resource_definition: >-
      {{ (scale_down_resource_definition_json | from_json)
         if (scale_down_resource_definition_json is string)
         else scale_down_resource_definition_json }}
  vars:
    scale_down_resource_definition_json: |
      {"spec": {"replicas": {{ smoketest_candidate_machineset.spec.replicas | d(1) - 1 }}}}
  delegate_to: "{{ delegation }}"

- name: scale_nodes | Wait for scale down
  kubernetes.core.k8s_info:
    ca_cert: "{{ cluster_cert_file }}"
    kubeconfig: "{{ kubeconfig_file }}"
    api_version: machine.openshift.io/v1beta1
    namespace: openshift-machine-api
    kind: MachineSet
    name: "{{ smoketest_candidate_machineset.metadata.name }}"
  delegate_to: "{{ delegation }}"
  register: smoketest_oc_get_machineset_item
  failed_when: smoketest_oc_get_machineset_item.resources[0].status.replicas != 0
  retries: 10
  delay: 60

- name: scale_nodes | Scale up machineset
  kubernetes.core.k8s:
    ca_cert: "{{ cluster_cert_file }}"
    kubeconfig: "{{ kubeconfig_file }}"
    state: patched
    api_version: machine.openshift.io/v1beta1
    namespace: openshift-machine-api
    kind: MachineSet
    name: "{{ smoketest_candidate_machineset.metadata.name }}"
    resource_definition: >-
      {{ (scale_up_resource_definition_json | from_json)
         if (scale_up_resource_definition_json is string)
         else scale_up_resource_definition_json }}
  vars:
    scale_up_resource_definition_json: |
      {"spec": {"replicas": {{ smoketest_candidate_machineset.spec.replicas | d(1) }}}}
  delegate_to: "{{ delegation }}"

- name: scale_nodes | Wait for scale up
  kubernetes.core.k8s_info:
    ca_cert: "{{ cluster_cert_file }}"
    kubeconfig: "{{ kubeconfig_file }}"
    api_version: machine.openshift.io/v1beta1
    namespace: openshift-machine-api
    kind: MachineSet
    name: "{{ smoketest_candidate_machineset.metadata.name }}"
  delegate_to: "{{ delegation }}"
  register: smoketest_oc_get_machineset_item
  failed_when: smoketest_oc_get_machineset_item.resources[0].status.readyReplicas | d(0) != 1
  retries: 15
  delay: 60
